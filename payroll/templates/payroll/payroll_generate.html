<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Payroll | ALAPAY</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #263b64;
        }

        label {
            display: block;
            margin: 25px 0 10px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #263b64;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1b2b4b;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #256029;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #263b64;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generate Payroll</h1>
        <p>Select a payroll period to generate employee payroll records.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="payroll_period">Payroll Period</label>

            <select name="payroll_period" id="payroll_period" required>
                <option value="">Select a payroll period</option>

                {% for period in periods %}
                    <option value="{{ period.id }}">
                        {{ period.name }} ({{ period.start_date }} to {{ period.end_date }}) - {{ period.status }}
                    </option>
                {% empty %}
                    <option value="">No payroll periods available</option>
                {% endfor %}
            </select>

            <button type="submit">Generate Payroll</button>
        </form>

        <a href="/admin/payroll/payrollrecord/" class="back">View Payroll Records</a>
    </div>
</body>
</html>
