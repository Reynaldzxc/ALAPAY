

{% extends "employees/base.html" %}

{% block title %}Create Leave Request | ALAPAY{% endblock %}

{% block content %}

<style>
    .leave-form-header {
        background: #013E37;
        color: white;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 25px;
    }

    .leave-form-header h1 {
        color: #FFEFB3;
        margin-bottom: 8px;
    }

    .leave-form-header p {
        color: #E1E9E4;
        margin: 0;
    }

    .leave-form-container {
        max-width: 750px;
        background: white;
        padding: 30px;
        border: 1px solid #E5E9E3;
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(1, 62, 55, 0.05);
    }

    .leave-form-container p {
        margin-bottom: 18px;
    }

    .leave-form-container label {
        display: block;
        font-weight: bold;
        color: #183D38;
        margin-bottom: 7px;
    }

    .leave-form-container input,
    .leave-form-container select,
    .leave-form-container textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #E5E9E3;
        border-radius: 7px;
        background: white;
    }

    .leave-form-container input:focus,
    .leave-form-container select:focus,
    .leave-form-container textarea:focus {
        outline: none;
        border-color: #013E37;
        box-shadow: 0 0 0 3px rgba(1, 62, 55, 0.10);
    }

    .leave-form-container input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
    }

    .leave-form-container ul.errorlist {
        color: #A33A32;
        margin-bottom: 8px;
    }

    .leave-form-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 25px;
    }
</style>

<div class="leave-form-header">
    <h1>Create Leave Request</h1>
    <p>Submit an employee leave request for review and approval.</p>
</div>

<div class="leave-form-container">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="leave-form-actions">
            <button type="submit" class="btn btn-primary">
                Submit Request
            </button>

            <a href="{% url 'benefits:leave-request-list' %}"
               class="btn btn-outline-primary">
                Cancel
            </a>
        </div>
    </form>

</div>

{% endblock %}
